<title>Esgii Studio: The Numbers Room</title>
<style>
:root{--bg:#0B1220;--card:#141E33;--card2:#1B2A47;--line:#2B3B5E;--text:#E6EBF5;--muted:#9AABC9;--coral:#FF6B4A;--gold:#F5B841;--teal:#2DD4BF;--red:#F87171;--blue:#60A5FA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Calibri,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topin{max-width:720px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-family:Cambria,Georgia,serif;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-family:inherit;font-weight:400}
.valpill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;color:var(--gold);white-space:nowrap}
.valpill.bump{border-color:var(--teal)}
.menu{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 10px;color:var(--muted)}
.dots{max-width:720px;margin:0 auto;padding:0 14px 8px;display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--teal)}.dots i.cur{background:var(--coral)}
.hero{position:relative;margin:14px 0 10px;border-radius:16px;overflow:hidden;aspect-ratio:16/8;background:var(--card)}
.hero img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.55)}
.hero .cap{position:absolute;left:16px;right:16px;bottom:12px}
.hero .chn{color:var(--coral);font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.hero h1{margin:2px 0 0;font-family:Cambria,Georgia,serif;font-size:28px;line-height:1.15}
.hero .sub{color:#CBD5E8;font-size:14px}
.credit{color:var(--muted);font-size:11px;margin:-4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2{font-family:Cambria,Georgia,serif;font-size:22px;margin:0 0 8px;line-height:1.25}
.card p{margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.cmd{color:var(--gold);border-color:#5b4a1f}.chip.hl{color:#0B1220;background:var(--blue);border-color:var(--blue)}
.chip.story{color:var(--coral);border-color:#6b2e22}.chip.topic{color:var(--teal);border-color:#1d5c55}
.q{font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px}
.opt:hover{border-color:#41558a}
.opt.sel{border-color:var(--gold)}
.opt.right{border-color:var(--teal);background:#0f2f33}
.opt.wrong{border-color:var(--red);background:#3a1c22}
.opt[disabled]{cursor:default}
.opt .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#0B1220;font-weight:800;margin-right:8px;font-size:14px}
.opt .d{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--gold);color:#0B1220;min-height:48px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.teal{background:var(--teal)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;background:#0f2f33;border:1px solid #1d5c55}
.fb.bad{background:#3a1c22;border-color:#6b2e36}
.fb.neutral{background:var(--card2);border-color:var(--line)}
.fb b.t{display:block;margin-bottom:4px}
.earn{color:var(--gold);font-weight:700}
.sortitem{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.sortitem .it{font-weight:600;margin-bottom:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;min-height:38px}
.cat.sel{background:var(--gold);color:#0B1220;border-color:var(--gold);font-weight:700}
.cat.right{background:var(--teal);color:#0B1220;border-color:var(--teal);font-weight:700}
.cat.wrong{background:var(--red);color:#0B1220;border-color:var(--red);font-weight:700}
.mark{font-weight:800;margin-left:6px}
.formula{background:#2a2410;border:1px solid #5b4a1f;color:#F7D488;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
input.num{width:100%;font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}

input.small{font-size:16px;padding:6px 8px;width:100px;text-align:right;border-radius:8px}
table.data{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
table.data th{background:var(--gold);color:#0B1220;padding:6px 8px;text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.stmt{width:100%;border-collapse:collapse;font-size:15px}
table.stmt th{background:var(--gold);color:#0B1220;padding:7px 8px;text-align:left}
table.stmt th:last-child{text-align:right}
table.stmt td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.stmt td:last-child{text-align:right;white-space:nowrap}
table.stmt tr.tot td:first-child{color:var(--teal);font-weight:700}
table.stmt tr.ok input{border-color:var(--teal)}table.stmt tr.no input{border-color:var(--red)}
.corr{display:block;font-size:12px;color:var(--teal)}
.slot{margin:12px 0}
.slot .lab{font-size:13px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.order .picked{min-height:44px;border:1px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0}
.order .pk{display:block;background:var(--card2);border-radius:8px;padding:6px 10px;margin:4px 0}
.order .pk.right{border-left:4px solid var(--teal)}.order .pk.wrong{border-left:4px solid var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.term{border-bottom:2px dotted var(--gold);cursor:help}
.pop{position:fixed;left:12px;right:12px;bottom:16px;max-width:560px;margin:0 auto;background:#22345a;border:1px solid var(--gold);border-radius:14px;padding:14px 16px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop b{color:var(--gold)}
ul.demands{padding-left:0;list-style:none;margin:8px 0}
ul.demands li{background:var(--card2);border-radius:10px;padding:8px 12px;margin:6px 0}
.data{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}
.data div{margin:4px 0}
.note{background:#2a2410;border:1px solid #5b4a1f;border-radius:10px;padding:8px 12px}
.small{font-size:14px;color:var(--muted)}
.big{font-size:40px;font-weight:800;font-family:Cambria,Georgia,serif;color:var(--gold);line-height:1.1}
.flip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flip button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:84px;text-align:left;font-size:14px}
.flip button b{color:var(--gold);font-size:15px}
.map{width:100%;border-collapse:collapse;font-size:15px}
.map td{padding:7px 8px;border-bottom:1px solid var(--line)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.g{background:var(--teal)}.a{background:var(--gold)}.r{background:var(--red)}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-width:0;font-size:22px;letter-spacing:.15em;text-transform:uppercase;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.bands button{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14px}
.bands button b{color:var(--gold);margin-right:6px}
.bands button.sel{border-color:var(--gold)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.nums button.sel{background:var(--gold);color:#0B1220}
ol.model{padding-left:18px}ol.model li{margin:6px 0}
.cert{text-align:center}
.cert .name{font-family:Cambria,Georgia,serif;font-size:26px}
.path li{margin:4px 0}
footer.cr{color:var(--muted);font-size:11px;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.anim .card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

const GLOSSARY = {

  "liability": "Legal responsibility for the debts of the business.",

  "privately held company": "A company whose shares are not sold to the public. In Mongolia, an LLC (ХХК).",

  "shareholder": "A person or organization that owns shares, and so part of a company.",
  "cooperative": "A business owned and run by its members, who share the surplus.",
  "NGO": "A non-governmental organization: a non-profit group, often funded by donations.",
  "vision statement": "A short statement of where the organization wants to be in the long term.",
  "mission statement": "A statement of what the organization does, for whom and how.",
  "strategic objective": "A long-term target for the whole business.",
  "tactical objective": "A short-term, specific target that helps to reach a strategic objective.",
  "CSR": "Corporate social responsibility: acting responsibly toward society and the environment beyond what the law requires.",

  "stakeholder": "Any person or group with an interest in, or affected by, a business.",

  "economies of scale": "Average cost falls as a business grows bigger.",
  "diseconomies of scale": "Average cost rises because the business has grown too big.",
  "average cost": "Total cost divided by the number of units made.",
  "merger": "Two businesses agree to join and become one new business.",
  "acquisition": "One business buys a controlling share of another.",
  "joint venture": "Two or more businesses create a new business together and share its cost, risk and profit.",

  "variable cost": "A cost that changes with output, such as raw materials.",
  "direct cost": "A cost linked to making one product, such as wool for slippers.",
  "indirect cost": "A cost for the whole business, not one product, such as the manager's salary.",
  "revenue stream": "A source of income for the business.",
  "total revenue": "Price per unit x quantity sold.",

  "goodwill": "The extra paid for a business above the value of its net assets.",

    { id: "p1s1", type: "story", title: "Year 4: the data room opens",

// Year 4 accounts by finance path (MNT million, fictional)
function SPL(s) {
  const f = s.vars.finance || "loan";
  const base = f === "retained" ? { rev: 600, cos: 240, exp: 230 } : { rev: 680, cos: 270, exp: 250 };
  const int = f === "loan" ? 10 : 0;
  const div = f === "angel" ? 50 : 40;
  const gp = base.rev - base.cos, pbit = gp - base.exp, pbt = pbit - int;
  const tax = Math.round(pbt * 0.10 * 100) / 100, pfp = pbt - tax, rp = pfp - div;
  return { ...base, int, div, gp, pbit, pbt, tax, pfp, rp };
}
function SOFP(s) {
  const f = s.vars.finance || "loan", acq = s.vars.growth === "acq";
  const ppe = f === "loan" ? 238 : f === "angel" ? 247 : 200;
  const tm = 12, gw = acq ? 15 : 0, cash = acq ? 25 : 40, debt = 35, stock = 75;
  const tc = 50, od = 5, loan = f === "loan" ? 45 : 0, sc = f === "angel" ? 120 : 60;
  const nca = ppe + tm + gw, ca = cash + debt + stock, ta = nca + ca, tl = tc + od + loan, na = ta - tl, re = na - sc;
  return { ppe, tm, gw, cash, debt, stock, tc, od, loan, sc, nca, ca, ta, tl, na, re };
}

const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function gl(html){
  return String(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === w.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${w}</span>` : w;
  });
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/mnt|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){
  $("brand").innerHTML = GAME.brand;
  $("val").textContent = "MNT " + fmt(S.val) + "M";
  $("dots").innerHTML = CHAPTERS.map((c, i) => `<i class="${i < S.ch || (S.screen === "report") ? "done" : i === S.ch && S.screen !== "start" ? "cur" : ""}"></i>`).join("");
}
function chips(st){
  let h = `<div class="chips"><span class="chip topic">${st.topic === "Final" ? (GAME.finalLabel || "Paper 1") : st.topic}</span>`;
  if (st.cmd) h += `<span class="chip cmd">${st.cmd} · ${CMD[st.cmd] || ""} · [${st.marks}]</span>`;
  if (st.hl) h += `<span class="chip hl">HL only · SL bonus</span>`;
  return h + "</div>";
}
function heroFor(c){
  const im = IMG[c.img];
  return `<div class="hero">${im ? `<img src="${im}" alt="">` : ""}<div class="cap"><div class="chn">${c.n === CHAPTERS.length ? "Finale" : (GAME.chapterWord || "Chapter") + " " + c.n} · ${c.topic === "Final" ? (GAME.finalLabel || "Paper 1") : c.topic}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div></div>${CREDITS[c.img] ? `<div class="credit">Photo: ${CREDITS[c.img]}</div>` : ""}`;
}
function nextBtn(label){ return `<div class="row"><button class="btn" data-act="next">${label || "Continue →"}</button></div>`; }

let lastKey = "";
function render(){
  header();
  const app = $("app");
  const key = S.screen + "|" + S.ch + "|" + S.step;
  if (key !== lastKey) { lastKey = key; app.classList.add("anim"); window.scrollTo(0, 0); } else app.classList.remove("anim");
  if (S.screen === "start") return app.innerHTML = startScreen();
  if (S.screen === "gate") return app.innerHTML = gateScreen();
  if (S.screen === "end") return app.innerHTML = endScreen();
  if (S.screen === "report") return app.innerHTML = reportScreen();
  const c = ch(), st = step();
  app.innerHTML = heroFor(c) + renderStep(st);
}

<div class="card"><h2>How to play</h2>${GAME.howto}

${ui.codeErr ? `<div class="fb bad">Not yet. Check the board and try again.</div>` : ""}</div>`;

function renderStep(st){
  const r = S.res[st.id];
  switch (st.type) {
    case "story": return `<div class="card"><div class="chips"><span class="chip story">Story</span></div><h2>${st.title}</h2>${gl(val(st.text))}${nextBtn()}</div>`;
    case "choice": return choiceStep(st, r);
    case "mcq": return mcqStep(st, r);
    case "sort": return sortStep(st, r);
    case "num": return numStep(st, r);
    case "build": return buildStep(st, r);
    case "order": return orderStep(st, r);
    case "statement": return stmtStep(st, r);
    case "notebook": return nbStep(st, r);
  }
}
function choiceStep(st, r){
  let h = `<div class="card"><div class="chips"><span class="chip story">Your decision</span></div><h2>${st.title}</h2><p class="q">${gl(st.q)}</p>`;
  st.opts.forEach((o, i) => {
    const cls = r ? (r.pick === i ? "opt sel" : "opt") : "opt";
    h += `<button class="${cls}" data-act="choose" data-i="${i}" ${r ? "disabled" : ""}><span class="k">${o.k}</span><b>${o.t}</b><span class="d">${o.d}</span></button>`;
  });
  if (r) {
    const o = st.opts[r.pick];
    const out = o.outFn ? o.outFn(S) : o.out;
    const d = r.delta;
    h += `<div class="fb neutral"><b class="t">What happens</b>${out}<p style="margin:8px 0 0"><b>Business idea:</b> ${o.concept}</p><p class="earn" style="margin:6px 0 0">Valuation ${d >= 0 ? "+" : ""}${fmt(d)} million</p>${r.after ? `<p style="margin:8px 0 0">${r.after}</p>` : ""}</div>${nextBtn()}`;
  }

}
function mcqStep(st, r){
  const opts = val(st.opts), order = shuffled(opts, st.id);
  const tries = (r && r.tries) || ui.tries || [];
  let h = `<div class="card">${chips(st)}<p class="q">${gl(val(st.q))}</p>`;
  order.forEach(i => {
    let cls = "opt";
    if (tries.includes(i)) cls += i === st.a ? " right" : " wrong";
    if (r && i === st.a) cls = "opt right";
    h += `<button class="${cls}" data-act="mcq" data-i="${i}" ${r || tries.includes(i) ? "disabled" : ""}>${opts[i]}</button>`;
  });
  if (!r && tries.length === 1) h += `<div class="fb bad"><b class="t">Not quite. One more try.</b></div>`;
  if (r) h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.earned === st.marks ? "Correct." : r.earned > 0 ? "Correct on the second try." : "The answer is shown in green."} <span class="earn">+${fmt(r.earned)}</span></b>${gl(st.explain)}</div>${nextBtn()}`;
  return h + "</div>";
}
function sortStep(st, r){
  const pick = r ? r.pick : (ui.pick || {});

  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p>`;
  order.forEach(i => {
    const [t, a] = st.items[i];
    h += `<div class="sortitem"><div class="it">${t}${r ? `<span class="mark" style="color:${pick[i] === a ? "var(--teal)" : "var(--red)"}">${pick[i] === a ? "✓" : "✗"}</span>` : ""}</div><div class="cats">`;
    st.cats.forEach((c, ci) => {
      let cls = "cat";
      if (r) { if (ci === a) cls += " right"; else if (pick[i] === ci) cls += " wrong"; }
      else if (pick[i] === ci) cls += " sel";
      h += `<button class="${cls}" data-act="sortpick" data-i="${i}" data-c="${ci}" ${r ? "disabled" : ""}>${c}</button>`;
    });
    h += `</div></div>`;
  });
  const all = st.items.every((_, i) => pick[i] !== undefined);
  if (!r) h += `<div class="row"><button class="btn" data-act="sortcheck" ${all ? "" : "disabled"}>Check</button><span class="small">${Object.keys(pick).length}/${st.items.length} placed</span></div>`;
  else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${st.items.length} correct <span class="earn">+${fmt(r.earned)}</span></b>${gl(st.explain)}</div>${nextBtn()}`;
  return h + "</div>";
}
function tableHtml(t){ return `<table class="data"><tr>${t.head.map(x => `<th>${x}</th>`).join("")}</tr>${t.rows.map(rw => `<tr>${rw.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</table>`; }
function numStep(st, r){
  const tries = (r && r.tries) || ui.tries || [];
  let h = `<div class="card">${chips(st)}${st.table ? tableHtml(st.table) : ""}<p class="q">${gl(st.q)}</p><div class="formula">🧮 ${st.formula}</div>`;
  if (!r) {
    h += `<input class="num" id="ans" inputmode="decimal" placeholder="${st.unit === "%" ? "Answer in %, e.g. 52.5" : "Answer in " + st.unit + ", e.g. 1,250,000"}" autocomplete="off"><div class="row"><button class="btn" data-act="numcheck">Check</button><span class="small">Work it out in your notebook first.</span></div>`;
    if (tries.length === 1) h += `<div class="fb bad"><b class="t">Not quite (you entered ${esc(tries[0])}). Check your working and try once more.</b></div>`;
  } else {
    h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.earned === st.marks ? "Correct." : r.earned > 0 ? "Correct on the second try." : "Here is the working."} <span class="earn">+${fmt(r.earned)}</span></b>${st.explain}</div>${nextBtn()}`;
  }
  return h + "</div>";
}
function buildStep(st, r){
  const pick = r ? r.pick : (ui.pick || {});
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p><p class="small">Build the answer an examiner would reward. Choose one piece for each part.</p>`;
  st.slots.forEach((sl, si) => {
    h += `<div class="slot"><div class="lab">${sl.label}</div>`;
    shuffled(sl.opts, st.id + si).forEach(oi => {
      let cls = "opt";
      if (r) { if (oi === 0) cls += " right"; else if (pick[si] === oi) cls += " wrong"; }
      else if (pick[si] === oi) cls += " sel";
      h += `<button class="${cls}" data-act="buildpick" data-s="${si}" data-o="${oi}" ${r ? "disabled" : ""}>${sl.opts[oi]}</button>`;
    });
    h += `</div>`;
  });
  const all = st.slots.every((_, i) => pick[i] !== undefined);
  if (!r) h += `<div class="row"><button class="btn" data-act="buildcheck" ${all ? "" : "disabled"}>Check my answer</button></div>`;
  else {
    const full = st.slots.map(sl => sl.opts[0]);
    h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${fmt(r.earned)} of ${st.marks} marks <span class="earn">+${fmt(r.earned)}</span></b>${gl(st.explain)}<p style="margin:8px 0 0"><b>Full-mark answer:</b> ${full.join(". ")}.</p><p class="small" style="margin:6px 0 0">📓 Copy the full-mark answer into your notebook.</p></div>${nextBtn()}`;
  }
  return h + "</div>";
}
function orderStep(st, r){
  const seq = r ? r.seq : (ui.seq || []);
  const pool = shuffled(st.items, st.id).filter(i => !seq.includes(i));
  let h = `<div class="card order">${chips(st)}<p class="q">${gl(st.q)}</p><div class="picked">`;
  seq.forEach((i, pos) => h += `<span class="pk ${r ? (i === pos ? "right" : "wrong") : ""}">${pos + 1}. ${st.items[i]}${r && i !== pos ? ` <span class="small">→ should be: ${st.items[pos]}</span>` : ""}</span>`);
  if (!seq.length) h += `<span class="small">Tap the lines below in order.</span>`;
  h += `</div>`;
  if (!r) {
    h += `<div class="pool">${pool.map(i => `<button class="cat" data-act="orderpick" data-i="${i}">${st.items[i]}</button>`).join("")}</div>
<div class="row"><button class="btn" data-act="ordercheck" ${seq.length === st.items.length ? "" : "disabled"}>Check</button><button class="btn ghost" data-act="orderundo" ${seq.length ? "" : "disabled"}>Undo</button></div>`;
  } else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${st.items.length} in the right place <span class="earn">+${fmt(r.earned)}</span></b>${st.explain}</div>${nextBtn()}`;
  return h + "</div>";
}
function cellNum(n){ if (n == null) return ""; const a = Math.abs(n); const s = (Math.round(a * 100) / 100).toLocaleString("en-US"); return n < 0 ? `(${s})` : s; }
function stmtStep(st, r){
  const rows = val(st.rows);
  const ans = r ? r.ans : {};
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p><table class="stmt"><tr><th>${val(st.title)}</th><th>MNT m</th></tr>`;
  rows.forEach((rw, i) => {
    const [label, given, answer] = rw;
    const tot = label.startsWith("=");
    if (answer === undefined) h += `<tr class="${tot ? "tot" : ""}"><td>${label}</td><td>${cellNum(given)}</td></tr>`;
    else {
      const ok = r ? r.ok[i] : null;
      h += `<tr class="${tot ? "tot" : ""} ${r ? (ok ? "ok" : "no") : ""}"><td>${label}</td><td><input class="num small" data-row="${i}" inputmode="decimal" ${r ? `value="${esc(ans[i] || "")}" disabled` : ""}>${r && !ok ? `<span class="corr">${cellNum(answer)}</span>` : ""}</td></tr>`;
    }
  });
  h += `</table>`;
  if (!r) h += `<div class="row"><button class="btn" data-act="stmtcheck">Check statement</button>${rows.some(r => typeof r[1] === "number" && r[1] < 0) ? `<span class="small">Brackets = taken away.</span>` : ""}</div>`;
  else h += `<div class="fb ${r.earned > 0 ? "" : "bad"}"><b class="t">${r.right}/${r.n} lines correct <span class="earn">+${fmt(r.earned)}</span></b>${val(st.explain)}<p class="small" style="margin:6px 0 0">📓 Copy the full statement into your notebook in this format.</p></div>${nextBtn()}`;
  return h + "</div>";
}
function nbStep(st, r){
  let h = `<div class="card">${chips(st)}<p class="q">${gl(st.q)}</p><p>📓 <b>Write a plan in your notebook</b> (6 to 8 minutes). Use these headings:</p><ol class="model">${st.guide.map(g => `<li>${g}</li>`).join("")}</ol>`;

  h += `<div class="fb neutral"><b class="t">A model plan</b><ol class="model">${st.model.map(m => `<li>${m}</li>`).join("")}</ol></div>`;
  h += `<p style="margin-top:14px"><b>Mark your plan.</b> Compare it with the markband, then ask your team's Examiner to agree your mark.</p><div class="bands">${st.bands.map(b => `<button disabled><b>${b[0]}</b>${b[1]}</button>`).join("")}</div>`;
  const pick = r ? r.earned : ui.nb;

  if (!r) h += `<div class="row"><button class="btn" data-act="nbsave" ${ui.nb === undefined ? "disabled" : ""}>Confirm my mark</button></div>`;
  else h += `<div class="fb"><b class="t">Mark recorded <span class="earn">+${fmt(r.earned)}</span></b>Be honest: an exam marker will not be generous.</div>${nextBtn("See the chapter summary →")}`;
  return h + "</div>";
}
function chapterScore(i){ let e = 0, m = 0; Object.values(S.res).forEach(x => { if (x.ch === i && x.max) { e += x.earned; m += x.max; } }); return [e, m]; }

<div class="card"><h2>While you wait: key terms</h2><p class="small">Say the meaning, then tap to check.</p><div class="flip">${c.terms.map((t, i) => `<button data-act="flip" data-i="${i}">${ui.flip && ui.flip[i] ? `<b>${t}</b><br>${GLOSSARY[t]}` : `<b>${t}</b><br><span class="small">Tap to check</span>`}</button>`).join("")}</div></div>
<div class="row"><button class="btn" data-act="tonext">${last ? "See my Founder's Report →" : "Next chapter →"}</button></div>`;

function topicMap(){
  const t = {}; Object.values(S.res).forEach(x => { if (!x.max) return; t[x.topic] = t[x.topic] || [0, 0]; t[x.topic][0] += x.earned; t[x.topic][1] += x.max; });
  return t;
}
const PATHS = GAME.paths;

  const t = topicMap(); const keys = ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "3.1", "3.2", "3.3", "3.4", "Final"];

<div class="card"><h2>Your revision map</h2><table class="map">${rows}</table><p style="margin-top:10px">${weak.length ? `🎯 <b>Revise first:</b> ${weak.join(", ")}. Reread these sections in your coursebook tonight.` : "🎯 Strong across every topic. Next step: past Paper 1 and Paper 2 questions."}</p></div>
<div class="card"><h2>Your path</h2><ul class="path">${path}</ul><p class="small">Different choices lead to different accounts and endings. Play again to try another path.</p><div class="row"><button class="btn ghost" data-act="reset">Play again</button></div></div>`;

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.set && o.set.entity) S.vars.entityBefore = S.vars.entity;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, st.answer)) return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries });
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const right = st.slots.filter((_, i) => ui.pick[i] === 0).length; return record(st, right * st.marks / st.slots.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const c = document.querySelector('[data-act="code"],[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
